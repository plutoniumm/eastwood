[linter]
fail_on = "warning"

[python]
enable = ["py/*"]
disable = ["py/print-statement"]

[latex]
enable = ["tex/*"]
disable = []

# [latex.rules."tex/space-before-punctuation"]
# allow_before = [":", ";", "!", "?"]

[go]
enable = ["go/*"]
disable = ["go/todo-comment", "go/naked-return", "go/goroutine-anon"]

[rust]
enable = ["rs/*"]
disable = ["rs/clone", "rs/print"]

[javascript]
enable = ["js/*"]
disable = ["js/todo-comment"]

[typescript]
enable = ["js/*", "ts/*"]
disable = ["js/todo-comment"]

# Svelte has no native markup rules; component <script> blocks and template
# expressions ({#if}, {#each}, ternaries, ...) are analysed as JS/TS, so the
# rule IDs are js/* and ts/*, not svelte/*.
[svelte]
enable = ["js/*", "ts/*"]
disable = ["js/todo-comment"]
